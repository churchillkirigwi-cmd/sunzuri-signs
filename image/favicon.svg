<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Gradients -->
    <linearGradient id="cyan-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#ff4fd8" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="#05060a" />

  <!-- Outer Neon Border -->
  <rect x="30" y="30" width="452" height="452" rx="80" fill="none" stroke="#00e5ff" stroke-width="12" filter="url(#glow-cyan)" opacity="0.8"/>

  <!-- Stylized Neon 'S' Sign Badge -->
  <path d="M 330 170 
           C 330 110, 180 110, 180 190 
           C 180 280, 330 240, 330 330 
           C 330 410, 180 410, 180 350" 
        fill="none" 
        stroke="url(#cyan-pink)" 
        stroke-width="48" 
        stroke-linecap="round" 
        filter="url(#glow-pink)" />
</svg>
