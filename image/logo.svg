<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 100" width="100%" height="100%">
  <defs>
    <!-- Neon Glow Effect -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#ff4fd8" />
    </linearGradient>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 12)">
    <rect x="0" y="0" width="76" height="76" rx="18" fill="#111" stroke="#00e5ff" stroke-width="3" filter="url(#neon-glow)"/>
    <path d="M 52 26 C 52 16, 24 16, 24 30 C 24 45, 52 39, 52 52 C 52 64, 24 64, 24 54" 
          fill="none" 
          stroke="url(#neon-grad)" 
          stroke-width="8" 
          stroke-linecap="round" />
  </g>

  <!-- Brand Name Text -->
  <text x="105" y="52" fill="#00e5ff" font-family="'Poppins', sans-serif" font-weight="700" font-size="32" filter="url(#neon-glow)">
    SUNZURI
  </text>
  <text x="105" y="78" fill="#ff4fd8" font-family="'Poppins', sans-serif" font-weight="600" font-size="20" letter-spacing="4" filter="url(#neon-glow)">
    SIGNS
  </text>
</svg>
